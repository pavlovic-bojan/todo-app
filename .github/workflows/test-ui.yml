name: 🧪 UI Tests

on:
  workflow_dispatch: # Manual trigger only

jobs:
  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: ☕ Setup Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install test dependencies
        run: |
          cd test && npm install

      - name: 🎭 Install Playwright browsers
        run: |
          cd test
          npx playwright install --with-deps chromium

      - name: 🔍 Verify servers are accessible
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://todo-app-xhn2.onrender.com' }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://todo-app-frontend-seven-rho.vercel.app' }}
        run: |
          echo "🔍 Checking backend health..."
          BACKEND_API_URL="$BACKEND_URL"
          if [[ ! "$BACKEND_URL" == *"/api"* ]]; then
            BACKEND_API_URL="$BACKEND_URL/api"
          fi
          curl -f "$BACKEND_API_URL/health" || echo "⚠️ Backend health check failed, but continuing..."
          
          echo "🔍 Checking frontend..."
          curl -f "$FRONTEND_URL" || echo "⚠️ Frontend check failed, but continuing..."

      - name: 🧪 Run UI tests
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://todo-app-xhn2.onrender.com' }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://todo-app-frontend-seven-rho.vercel.app' }}
          CI: true
        run: |
          cd test
          echo "🌐 Using Backend: $BACKEND_URL"
          echo "🌐 Using Frontend: $FRONTEND_URL"
          npm run test:ui

      - name: 📊 Generate Allure report
        if: always()
        run: |
          cd test
          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            npx allure generate allure-results --clean -o allure-report
            echo "✅ Allure report generated successfully"
          else
            echo "⚠️ No test results found, creating empty report"
            mkdir -p allure-report
            echo '<!DOCTYPE html><html><head><title>No Test Results</title></head><body><h1>No test results available</h1><p>Tests did not produce any results.</p></body></html>' > allure-report/index.html
          fi

      - name: 📤 Upload Allure report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-ui
          path: test/allure-report
          retention-days: 30

      - name: 📸 Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots-ui
          path: test/test-results/
          retention-days: 7

      - name: 🚀 Deploy Allure Report to GitHub Pages
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v3
        env:
          PERSONAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./test/allure-report
          publish_branch: gh-pages
          destination_dir: ./ui-tests

      - name: 📢 Report Allure Report URL
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          echo "📊 Allure Report deployed to GitHub Pages"
          echo "🔗 View report at: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ui-tests/"
