name: 🧪 Run All Tests

# Trigger on every push and PR
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Allow manual trigger

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install dependencies
        run: |
          cd backend
          npm install

      - name: 🗄️ Setup test database
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          cd backend
          npm run prisma:generate
          npx prisma migrate deploy

      - name: 🧪 Run backend tests
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          JWT_SECRET: test-secret-key-for-ci-pipeline-only
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only
        run: |
          cd backend
          npm test

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install dependencies
        run: |
          cd frontend
          npm install

      - name: 🧪 Run frontend tests
        run: |
          cd frontend
          npm test

  e2e-tests:
    name: E2E Tests (Smoke)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests] # Run after unit tests pass
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: ☕ Setup Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install all dependencies
        run: |
          cd backend && npm install
          cd ../frontend && npm install
          cd ../test && npm install

      - name: 🎭 Install Playwright browsers
        run: |
          cd test
          npx playwright install --with-deps chromium

      - name: 🗄️ Setup database
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          cd backend
          npm run prisma:generate
          npx prisma migrate deploy

      - name: 🚀 Start backend
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          JWT_SECRET: test-secret-key-for-ci-pipeline-only
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only
          PORT: 3000
        run: |
          cd backend
          npm run dev &
          sleep 10

      - name: 🎨 Start frontend
        env:
          VITE_API_URL: http://localhost:3000
        run: |
          cd frontend
          npm run dev &
          sleep 10

      - name: 🧪 Run smoke tests
        run: |
          cd test
          npm run test:smoke

      - name: 📊 Generate Allure report
        if: always()
        run: |
          cd test
          npx allure generate allure-results --clean -o allure-report

      - name: 📤 Upload Allure report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: test/allure-report
          retention-days: 30

      - name: 📸 Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test/test-results/
          retention-days: 7

      - name: 🚀 Deploy Allure Report to GitHub Pages
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v3
        env:
          PERSONAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./test/allure-report
          publish_branch: gh-pages
          destination_dir: ./

      - name: 📢 Report Allure Report URL
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          echo "📊 Allure Report deployed to GitHub Pages"
          echo "🔗 View report at: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

